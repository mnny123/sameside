<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <title>Same Side</title>
  <meta name="robots" content="noindex">
  <!-- Single page app redirect for GitHub Pages.
       Converts the requested path into a query string and sends the browser
       to index.html, which restores the real path for the router.
       pathSegmentsToKeep is 1 because the site is served from /sameside.
       See https://github.com/rafgraph/spa-github-pages -->
  <script>
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <noscript>
    <p>This page is on the wrong side. Head back to
    <a href="/sameside/">the Same Side home page</a>.</p>
  </noscript>
</body>
</html>
